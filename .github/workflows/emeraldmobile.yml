name: EmeraldMobile Build

on:
  workflow_dispatch:
  push:
    paths:
      - "EmeraldMobile/**"
      - ".github/workflows/emeraldmobile.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: EmeraldMobile
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: EmeraldMobile
        run: xcodebuild -project EmeraldMobile.xcodeproj -scheme EmeraldMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package app
        run: |
          cd EmeraldMobile/build/DerivedData/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/EmeraldMobile-unsigned.zip" EmeraldMobile.app

      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldMobile-unsigned
          path: EmeraldMobile-unsigned.zip
