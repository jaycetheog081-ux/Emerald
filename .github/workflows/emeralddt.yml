name: EmeraldDT Build

on:
  workflow_dispatch:
  push:
    paths:
      - "EmeraldDT/**"
      - ".github/workflows/emeralddt.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: EmeraldDT
        run: xcodegen generate

      - name: Build macOS app
        working-directory: EmeraldDT
        run: xcodebuild -project EmeraldDT.xcodeproj -scheme EmeraldDT -configuration Release -sdk macosx -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package app
        run: |
          cd EmeraldDT/build/DerivedData/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent EmeraldDT.app "$GITHUB_WORKSPACE/EmeraldDT-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldDT-macos
          path: EmeraldDT-macos.zip
