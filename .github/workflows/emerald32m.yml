name: Emerald32M Build

on:
  workflow_dispatch:
  push:
    paths:
      - "Emerald32M/**"
      - ".github/workflows/emerald32m.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: Emerald32M
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: Emerald32M
        run: xcodebuild -project Emerald32M.xcodeproj -scheme Emerald32M -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package app
        run: |
          cd Emerald32M/build/DerivedData/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/Emerald32M-unsigned.zip" Emerald32M.app

      - uses: actions/upload-artifact@v4
        with:
          name: Emerald32M-unsigned
          path: Emerald32M-unsigned.zip
